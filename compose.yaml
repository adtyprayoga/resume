# Combined deployment: the resume app with optional PDF import.
# The static-only deployment needs none of this: `docker build .` as before.
#
#   cp .env.example .env   # optional; every value has a default
#   docker compose up -d --build
#
# One public address (web). The pdf-import service publishes no port.

services:
  web:
    build:
      context: .
      args:
        VITE_PDF_IMPORT: "1"
        NGINX_CONF: nginx.pdf-import.conf
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    # No depends_on: the site and JSON import keep working while the backend
    # is starting, unhealthy or stopped; PDF conversion reports "unavailable".

  pdf-import:
    build:
      context: services/pdf-import
      target: runtime
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    environment:
      PDF_IMPORT_MAX_BYTES: ${PDF_IMPORT_MAX_BYTES:-10485760}
      PDF_IMPORT_MAX_PAGES: ${PDF_IMPORT_MAX_PAGES:-5}
      PDF_IMPORT_TIMEOUT_SECONDS: ${PDF_IMPORT_TIMEOUT_SECONDS:-180}
      PDF_IMPORT_RESULT_TTL_SECONDS: ${PDF_IMPORT_RESULT_TTL_SECONDS:-600}
      # Validated by the service against the limits below, so they cannot drift apart.
      PDF_IMPORT_MEMORY_LIMIT_BYTES: ${PDF_IMPORT_MEMORY_LIMIT_BYTES:-2750000000}
      PDF_IMPORT_CPU_LIMIT: ${PDF_IMPORT_CPU_LIMIT:-2}
      HOME: /tmp
    mem_limit: ${PDF_IMPORT_MEMORY_LIMIT_BYTES:-2750000000}
    # Equal to mem_limit: no swap on top of the memory cap.
    memswap_limit: ${PDF_IMPORT_MEMORY_LIMIT_BYTES:-2750000000}
    cpus: ${PDF_IMPORT_CPU_LIMIT:-2}
    pids_limit: 256
    read_only: true
    tmpfs:
      # Uploads and conversion scratch only; counts against mem_limit.
      - /tmp:size=96m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/pdf-import/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
