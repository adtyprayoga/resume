# Combined deployment: the static app plus a same-origin proxy to the private
# pdf-import service (compose.yaml). Same-origin routing is not access control;
# the rate limits and the backend's single slot are the abuse protection.

# Behind a reverse proxy on a private network (Coolify's Traefik, a load
# balancer), limit per original client rather than per proxy: trust
# X-Forwarded-For only from private addresses.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=pdf_upload:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pdf_api:10m rate=4r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving per request lets the site start, and keep
    # serving, while the backend is down; the browser then sees a 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pdf_import http://pdf-import:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Uploads: 10 MiB PDF plus multipart framing. Paths carry job IDs, so no access log.
    location = /api/pdf-import/jobs {
        access_log off;
        limit_req zone=pdf_upload burst=2 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 10256k;
        client_body_timeout 30s;
        proxy_pass $pdf_import;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Job paths are capabilities: keep them out of the access log and of
    # routine error-log lines (upstream failures, rate limiting).
    location /api/pdf-import/ {
        access_log off;
        error_log /dev/stderr crit;
        limit_req zone=pdf_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass $pdf_import;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
